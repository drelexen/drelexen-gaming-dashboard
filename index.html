<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drelexen OS - Gaming Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ffffff;
            width: 100%;
            height: 100%;
        }

        /* Ambient glow backdrop */
        .glow-backdrop {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.15) 0%, rgba(5, 8, 17, 0) 60%);
            z-index: 1;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .console-header {
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 10;
        }

        .username {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(0,255,204,0.6);
            text-transform: uppercase;
        }

        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .shelf-title {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 40px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
        }

        .game-shelf {
            display: flex;
            gap: 40px;
        }

        /* Game Card Structure */
        .game-card {
            width: 240px;
            height: 340px;
            border-radius: 16px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        /* Direct local image loading */
        .card-bg {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.5s ease;
        }

        /* Cinematic Gradient Text Overlay */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(5,8,17,0.95) 0%, rgba(5,8,17,0) 100%);
            display: flex;
            align-items: flex-end;
            padding: 24px;
            box-sizing: border-box;
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Hover states */
        .game-card:hover {
            transform: scale(1.1) translateY(-10px);
        }
        .game-card:hover .card-bg {
            transform: scale(1.1);
        }
        
        .game-card[data-game="minecraft"]:hover {
            border-color: #55ff55;
            box-shadow: 0 0 30px rgba(85, 255, 85, 0.4);
        }
        .game-card[data-game="roblox"]:hover {
            border-color: #ff3333;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.4);
        }
        .game-card[data-game="asphalt"]:hover {
            border-color: #3399ff;
            box-shadow: 0 0 30px rgba(51, 153, 255, 0.4);
        }

        /* Loading Screen Portal */
        .loading-portal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050811;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .loading-portal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00ffcc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glow-backdrop" id="bgGlow"></div>

    <div class="console-header">
        <div class="username">DRELEXEN</div>
    </div>

    <div class="main-container">
        <!-- New Dashboard Title -->
        <div class="shelf-title">Drex's Gaming Dashboard</div>
        <div class="game-shelf">
            
            <!-- MINECRAFT CARD -->
            <div class="game-card" data-game="minecraft" data-url="https://minecraft.net" onmouseenter="setTheme('#55ff55')" onmouseleave="resetTheme()">
                <div class="card-bg" style="background-image: url('minecraft.jpg')"></div>
                <div class="card-overlay">
                    <div class="game-title">MINECRAFT</div>
                </div>
            </div>

            <!-- ROBLOX CARD -->
            <div class="game-card" data-game="roblox" data-url="https://roblox.com" onmouseenter="setTheme('#ff3333')" onmouseleave="resetTheme()">
                <div class="card-bg" style="background-image: url('roblox.jpg')"></div>
                <div class="card-overlay">
                    <div class="game-title">ROBLOX</div>
                </div>
            </div>

            <!-- ASPHALT 9 CARD -->
            <div class="game-card" data-game="asphalt" data-url="https://www.gameloft.com/minisites/p/index.php/alegends/" onmouseenter="setTheme('#3399ff')" onmouseleave="resetTheme()">
                <div class="card-bg" style="background-image: url('asphalt.jpg')"></div>
                <div class="card-overlay">
                    <div class="game-title">ASPHALT 9</div>
                </div>
            </div>

        </div>
    </div>

    <div class="loading-portal" id="portal">
        <div class="spinner" id="portalSpinner"></div>
    </div>

    <script>
        const bgGlow = document.getElementById('bgGlow');
        const portal = document.getElementById('portal');
        const spinner = document.getElementById('portalSpinner');

        function setTheme(color) {
            bgGlow.style.background = `radial-gradient(circle, ${color}25 0%, rgba(5, 8, 17, 0) 60%)`;
        }
        function resetTheme() {
            bgGlow.style.background = `radial-gradient(circle, rgba(0, 255, 204, 0.15) 0%, rgba(5, 8, 17, 0) 60%)`;
        }

        document.querySelectorAll('.game-card').forEach(card => {
            card.addEventListener('click', () => {
                const targetUrl = card.getAttribute('data-url');
                const gameType = card.getAttribute('data-game');
                
                if(gameType === 'minecraft') spinner.style.borderTopColor = '#55ff55';
                if(gameType === 'roblox') spinner.style.borderTopColor = '#ff3333';
                if(gameType === 'asphalt') spinner.style.borderTopColor = '#3399ff';

                portal.classList.add('active');

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1200);
            });
        });
    </script>
</body>
</html>
